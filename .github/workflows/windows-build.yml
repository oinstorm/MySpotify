name: Windows build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tool versions
        shell: pwsh
        run: |
          go version
          node --version
      - name: Format source
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter *.go | ForEach-Object { gofmt -w $_.FullName }
      - name: Vet Spotify
        run: go vet ./internal/spotify
      - name: Compile Player
        run: go test -run '^$' ./internal/player
      - name: Vet Player
        run: go vet ./internal/player
      - name: Vet App
        run: go vet ./internal/app
      - name: Vet Lyrics
        run: go vet ./internal/lyrics
      - name: Spotify tests
        run: go test -v ./internal/spotify
      - name: App update tests
        run: go test -v ./internal/app -run "^(TestUpdate|TestAutoUpdateSetting|TestNoteLines)"
      - name: App UI tests
        run: go test -v ./internal/app -run "^(TestAccount|TestArtist|TestArtwork|TestBackdrop|TestBrowse|TestCache|TestCover|TestCovered|TestCovers|TestScroll|TestShort|TestArt|TestPlay|TestSigned|TestBack|TestHome|TestLibrary|TestLike|TestLog|TestNotch|TestNow|TestQueue)"
      - name: Connect remote ownership
        shell: pwsh
        run: go test -v ./internal/app -run '^TestConnectRemoteOwnership$' 2>&1 | Tee-Object connect-ownership.log; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Connect revoke and resume
        shell: pwsh
        run: go test -v ./internal/app -run '^(TestConnectRevokesOwnership|TestConnectResumeAndPlayRouting)$' 2>&1 | Tee-Object connect-revoke.log; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Connect queue and device tests
        shell: pwsh
        run: go test -v ./internal/app -run '^(TestConnectAdoptsExtendedQueue|TestConnectDeviceMenu|TestConnectQueueIsTheClusters|TestConnectNamesTheArtist)$' 2>&1 | Tee-Object connect-queue.log; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Connect logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-test-logs-${{ github.sha }}
          path: connect-*.log
          if-no-files-found: ignore
          retention-days: 3
      - name: App edit and session tests
        run: go test -v ./internal/app -run "^(TestAdd|TestRemove|TestNo|TestCreate|TestRename|TestDelete|TestCancel|TestSave|TestRadio|TestPlayed|TestRecent|TestScrub|TestSeal|TestSession)"
      - name: App sign-in tests
        run: go test -v ./internal/app -run "^(TestPodcast|TestSignIn)"
      - name: App space and track tests
        run: go test -v ./internal/app -run "^(TestSpace|TestTrack)"
      - name: App long transcript test
        shell: pwsh
        run: |
          go test -v ./internal/app -run '^TestLongLyricsBuildOnlyWhatShows$' *> long-transcript.log
          exit $LASTEXITCODE
      - name: Upload transcript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-test-log-${{ github.sha }}
          path: long-transcript.log
          if-no-files-found: ignore
          retention-days: 3
      - name: App song lyric tests
        run: go test -v ./internal/app -run "^(TestSongLyricsBuildWhole|TestEpisodesTranscriptIsItsSubtitles)$"
      - name: App episode test
        run: go test -v ./internal/app -run "^TestEpisodes$"
      - name: App tray video and menus
        run: go test -v ./internal/app -run "^(TestTray|TestClock|TestMV|TestSkeleton|TestSongMenu)"
      - name: Player tests
        run: go test -v ./internal/player
      - name: Lyrics tests
        run: go test -v ./internal/lyrics
      - name: Player page tests
        run: node internal/player/web/player.test.cjs
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-test | Out-Null
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-H windowsgui -s -w" -o build-test/MySpotify.exe .
          (Get-FileHash build-test/MySpotify.exe -Algorithm SHA256).Hash | Set-Content build-test/MySpotify.exe.sha256
      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: MySpotify-windows-amd64-exe-${{ github.sha }}
          path: |
            build-test/MySpotify.exe
            build-test/MySpotify.exe.sha256
          retention-days: 14
      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md -Destination build-test
          Copy-Item licenses -Destination build-test -Recurse
          @"
          MySpotify Windows proxy test build

          This is an unsigned CI build. It is not an official release and does not include signed auto-update metadata.
          Install the Microsoft WebView2 Runtime before launching.
          Configure the HTTP proxy in Settings, then fully exit MySpotify from the tray and reopen it.
          Supported proxy form: http://host:port. SOCKS5, PAC and proxy authentication are not supported in this build.
          "@ | Set-Content build-test/README-proxy.txt
          $name = "MySpotify-windows-amd64-${{ github.sha }}.zip"
          Compress-Archive -Path build-test/* -DestinationPath $name
          (Get-FileHash $name -Algorithm SHA256).Hash | Set-Content "$name.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MySpotify-windows-amd64-${{ github.sha }}
          path: |
            MySpotify-windows-amd64-${{ github.sha }}.zip
            MySpotify-windows-amd64-${{ github.sha }}.zip.sha256
          retention-days: 14
